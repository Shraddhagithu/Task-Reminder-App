<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Tasks</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        a button {
            padding: 4px 8px;
            margin: 2px;
        }
    </style>
</head>
<body>

<h2>All Tasks</h2>

<a th:href="@{/tasks/add}">Add New Task</a><br/><br/>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Description</th>
        <th>Due Date</th>
        <th>Status</th>
        <th>Priority</th>
        <th>Created At</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:if="${#lists.isEmpty(tasks)}">
        <td colspan="8">No tasks found</td>
    </tr>

    <tr th:each="task : ${tasks}">
        <td th:text="${task.id}"></td>
        <td th:text="${task.title}"></td>
        <td th:text="${task.description}"></td>
        <td th:text="${#temporals.format(task.dueDate, 'dd-MM-yyyy HH:mm')}"></td>
        <td th:text="${task.status}"></td>
        <td th:text="${task.priority}"></td>
        <td th:text="${#temporals.format(task.created, 'dd-MM-yyyy HH:mm')}"></td>
        <td>
            <a th:href="@{/tasks/edit/{id}(id=${task.id})}">
                <button>Edit</button>
            </a>
            <a th:href="@{/tasks/delete/{id}(id=${task.id})}">
                <button>Delete</button>
            </a>
            <a th:href="@{/tasks/check/{id}(id=${task.id})}">
                <button>✔ Check</button>
            </a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
